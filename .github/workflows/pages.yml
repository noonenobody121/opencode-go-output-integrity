name: Deploy static research site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from json import loads
          root=Path('site')
          assert all((root/p).is_file() for p in ['index.html','styles.css','script.js','data/evidence.json'])
          html=(root/'index.html').read_text()
          assert 'OpenCode Go' in html and 'quantization' in html.lower()
          loads((root/'data/evidence.json').read_text())
          for p in root.rglob('*'):
              if p.is_file():
                  assert not any(x in p.read_text(errors='ignore') for x in ['romania.resell69@gmail.com','ses_e82bb8aa8fferqFVczW8YdYpiQ'])
          print('Public static website validated')
          PY
      - name: Reconstruct the verified silent video
        shell: bash
        run: |
          mkdir -p site/evidence/assets/media
          cat site/evidence/video_parts/part-*.b64 | base64 --decode > site/evidence/assets/media/opencode-go-full-46s-muted.mp4
          echo "99c6ed796ce62d70954fe0dbb7ce91d9afc628d02afd5c01d8e0f501910f2b51  site/evidence/assets/media/opencode-go-full-46s-muted.mp4" | sha256sum --check
          rm -rf site/evidence/video_parts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
